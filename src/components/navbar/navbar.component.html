<nav class="fixed top-4 left-1/2 -translate-x-1/2 z-50 dock-outer" (mouseleave)="onMouseLeave()">
  
  <div 
    class="dock-panel" 
    (mousemove)="onMouseMove($event)"
  >
    <div class="flex items-center justify-center h-16 gap-1 sm:gap-2">
      
      <div class="hidden md:flex items-center">
        @for (link of navLinks; track link.path) {
          <div class="dock-item group">
            <span class="dock-label">{{ link.label }}</span>

            <a 
              #navItem
              [routerLink]="link.path" 
              routerLinkActive="active-link" 
              [routerLinkActiveOptions]="{exact: true}"
              [style.transform]="'scale(' + getScale(navItem) + ')'"
              class="nav-link"
            >
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="link.icon" />
              </svg>
            </a>
          </div>
        }
      </div>
      
      <div class="flex md:hidden items-center justify-between w-full min-w-[180px] px-4">
        <a routerLink="/" class="text-gray-900 font-bold tracking-wider">HBS</a>
        <button (click)="toggleMenu()" class="p-2 text-gray-600 hover:text-gray-900 transition-colors">
          @if (!isMenuOpen()) {
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
          } @else {
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
          }
        </button>
      </div>
    </div>
  </div>

  @if (isMenuOpen()) {
    <div class="md:hidden mt-2 px-2 pt-2 pb-3 space-y-1 rounded-3xl bg-white/80 backdrop-blur-lg border border-gray-200 shadow-xl">
      @for (link of navLinks; track link.path) {
        <a 
          [routerLink]="link.path" 
          routerLinkActive="bg-blue-500/20 text-blue-700" 
          (click)="closeMenu()" 
          class="text-gray-700 hover:text-gray-900 block px-4 py-2 rounded-xl text-base font-medium transition-colors"
        >
          {{ link.label }}
        </a>
      }
    </div>
  }
</nav>
